<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MEU SUS</title>
</head>
<body>

    <header> <H1> SEUS ÚLTIMOS SUSPIROS (SUS) </H1> </header>

    <form id="triagem">

        <div id="tab_nome">
            <label for="nome">Digite o nome do Paciente: </label>
            <input type="text" name="nome" id="nome" placeholder="Ex.: João, Maria, José" maxlength="30">
        </div>

        <div id="tab_idade">
            <label for="idade"> Digite a idade do Paciente: </label>
            <input type="number" name="idade" id="idade" placeholder="Ex.: 30" min="0" max="120">
        </div>

        <!-- <div id="cor_pulseira"> 
            <label for="pulseira">Digite a Cor da Pulseira:</label>
            <input type="text" name="pulseira" id="pulseira" placeholder="Ex.: Vermelho, Amarelo e Verde" maxlength="10">
        </div> -->

        <div>
            <label for="sexo"> Qual o sexo do paciente:</label>
            <select name="sexo" id="sexo">
                <option value="">Selecione uma opção:</option>
                <option value="Masculino"> Masculino</option>
                <option value="Feminino"> Feminino</option>
            </select>
        </div>
    
       <div id="campo_gestante" style="display: none;">

            <label for="gestante">A paciente é gestante?</label>
            <select name="gestante" id="gestante">
                <option value="">Selecione uma opção:</option>
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
            </select>
            
        </div>

    </form>
      
    <p id="retorno"> </p>    

    
    <script src="script.js"> </script>

</body>
</html>
